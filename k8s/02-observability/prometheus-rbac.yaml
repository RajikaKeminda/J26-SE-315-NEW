# Prometheus needs read access to the Kubernetes API to discover pods to
# scrape (kubernetes_sd_configs). This grants exactly that, cluster-wide
# (read-only) - standard minimum permissions for a self-hosted Prometheus.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: autoscaler-poc
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources: ["nodes", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions", "networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: autoscaler-poc
