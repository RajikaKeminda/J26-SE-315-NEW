# The MO-TD3 autoscaler + control-room dashboard, running in-cluster.
#
# AUTOSCALER_SHADOW=1 observes and logs decisions without changing anything.
# Set it to "0" (the default below) to let the agent actually scale and resize the six
# demo services. AUTOSCALER_CONTROLLER picks the controller (mo_td3 | hpa | vpa |
# threshold | static) - it can also be switched at run time from the dashboard.
# Exactly ONE replica: two controllers would fight each other.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autoscaler
  namespace: autoscaler-poc
  labels:
    app: autoscaler
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: autoscaler
  template:
    metadata:
      labels:
        app: autoscaler
    spec:
      serviceAccountName: autoscaler
      containers:
        - name: autoscaler
          image: k8s-autoscaler/autoscaler:latest
          imagePullPolicy: IfNotPresent
          args: ["--mode", "live", "--port", "8080"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: AUTOSCALER_NAMESPACE
              value: "autoscaler-poc"
            - name: PROMETHEUS_URL
              value: "http://prometheus.autoscaler-poc.svc.cluster.local:9090"
            - name: JAEGER_QUERY_URL
              value: "http://jaeger.autoscaler-poc.svc.cluster.local:16686"
            - name: AUTOSCALER_SHADOW
              value: "0"
            - name: AUTODISCOVER_TOPOLOGY
              value: "1"
            - name: POLL_INTERVAL_SECONDS
              value: "10"
            - name: AUTOSCALER_CONTROLLER
              value: "mo_td3"
            # Live safety cap on total provisioned cost: what the cluster can actually schedule.
            # (kind in a 4 GiB / 8-CPU Docker VM has ~6 cores free after the control plane.)
            - name: CLUSTER_BUDGET_CORES
              value: "6"
            - name: METRIC_WINDOW
              value: "10s"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: autoscaler
  namespace: autoscaler-poc
  labels:
    app: autoscaler
spec:
  selector:
    app: autoscaler
  ports:
    - port: 8080
      targetPort: 8080
      name: http
