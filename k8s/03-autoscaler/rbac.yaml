# Least-privilege identity for the in-cluster autoscaler, in THIS namespace only:
#   - read Deployments (state),
#   - patch the scale subresource (replica changes),
#   - patch Deployments (CPU/memory resource changes, which roll the pods).
# Nothing else: no pods, no secrets, nothing cluster-scoped.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: autoscaler
  namespace: autoscaler-poc
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: autoscaler
  namespace: autoscaler-poc
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: autoscaler
  namespace: autoscaler-poc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: autoscaler
subjects:
  - kind: ServiceAccount
    name: autoscaler
    namespace: autoscaler-poc
